---
layout: default
title: Contact
permalink: /contact/
description: "Email, LinkedIn and GitHub."
---
<dl class="rows">
  <div class="row"><dt class="rail">Email</dt><dd class="body"><a href="mailto:{{ site.email }}">{{ site.email }}</a></dd></div>
  <div class="row"><dt class="rail">LinkedIn</dt><dd class="body"><a href="https://www.linkedin.com/in/{{ site.linkedin_username }}">{{ site.author }}</a></dd></div>
  <div class="row"><dt class="rail">GitHub</dt><dd class="body"><a href="https://github.com/{{ site.github_username }}">{{ site.github_username }}</a></dd></div>
</dl>
